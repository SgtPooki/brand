<!DOCTYPE html>
<html lang="en">
<!--
  SgtPooki LLC - Product Open Graph Card Template (1200x630)
  
  Usage to render PNG:
    npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1000 og-template.html og.png
    (or via headless Chrome / Brave)
-->
<head>
  <meta charset="UTF-8">
  <title>SgtPooki Product OG Card Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #0C0D0F;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(147, 197, 253, 0.05) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 72px;
      position: relative;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
    }

    .border-frame {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      pointer-events: none;
    }

    /* Top: Product Badge / Category */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .product-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #93C5FD;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(147, 197, 253, 0.2);
      padding: 6px 16px;
      border-radius: 9999px;
    }

    /* Center: Product Title & Description */
    .center-content {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
    }

    .product-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #F1F5F9;
      line-height: 1.05;
    }

    .product-description {
      font-size: 24px;
      font-weight: 400;
      color: #94A3B8;
      line-height: 1.5;
    }

    /* Bottom: Endorsement Footer & Domain */
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 24px;
    }

    .endorsement-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .endorsement-sp {
      width: 28px;
      height: 28px;
    }

    .endorsement-text {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #94A3B8;
    }

    .endorsement-brand {
      color: #F1F5F9;
      font-weight: 600;
    }

    .product-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="border-frame"></div>

  <!-- Top Category / Status -->
  <div class="top-row">
    <div class="product-category">Autonomous Market Intelligence</div>
  </div>
